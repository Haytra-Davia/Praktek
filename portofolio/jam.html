<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            height: 100vh;
            background: rgb(7, 7, 7);
        }
        h2{
            color: aliceblue;
            align-items: center;
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin: 10px 0;
        }
        .time{
            display: flex;
        }
        .time > div{
            position: relative;
            margin: 0 5px;
            background: transparent;
        }
        .time>div>span{
            position: relative;
            display: block;
            width: 100px;
            height: 80px;
            color: rgb(46, 3, 3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            z-index: 5;
            box-shadow: 0 0 0 1px #FFB22C;
            margin:  0 10px;
        }
        .time>div>span:nth-child(2){
            height: 30px;
            font-size: 18px;
            letter-spacing: 2px;
            z-index: 4;
            box-shadow: none;
            background: rgb(85, 0, 255);
        }
       
    </style>
    
</head>
<body>
    <h2>time</h2>
    <div class="time">
    <div>
        <span id="hours">00</span>
        <span>jam</span>
    </div>
    <div>
        <span id="minutes">00</span>
        <span>menit</span>
    </div>
    <div>
        <span id="seconds">00</span>
        <span>detik</span>
    </div>
</div>
<script>
    function clock(){
        var hours = document.getElementById("hours");
        var minutes = document.getElementById("minutes");
        var seconds = document.getElementById("seconds");

        var h =new Date().getHours();
       var m = new Date().getMinutes();
       var s= new Date().getSeconds();
      

        h = h < 10 ? "0" + h : h;
        m = m < 10 ? "0" + m : m;
        s = s < 10 ? "0" + s : s;

        hours.innerHTML = h;
        minutes.innerHTML = m;
        seconds.innerHTML = s;
    }
    var interval=setInterval(clock,1000)
</script>
</body>
</html>
